<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
         h1{
            margin: auto;
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border: 10px solid darkblue;

            padding: 10px;

            margin: 20px auto px 40px auto;

            outline: 5px dashed salmon;
         }


         a{
            border: 5px solid red;
            

            padding: 5px 5px 5px 5px;
            
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos tambem são exemplos de box-level, mas o <a href="#">links são exemplos de caixa inline-level</a>. Vamos ver como tudo isso funciona. </p>
    
</body>
</html>
