<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        /*muda a cor, tira o underline e muda o tamanho da fonte*/
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        /*se ja foi visitado então mude a cor para...*/
        a:visited {
            color: darkred;
        }
        /*quando o mouse passar mude para a cor... e coloque underline*/
        a:hover {
            color: black;
            text-decoration: underline;
        }
        /*quando clicado mude para a cor...*/
        a:active {
            color: yellow;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://scratch.mit.edu/">Site do Scratch</a></li>
        <li><a href="https://youtube.com/cursoemvideo/">Canal do youtube</a></li>
        <li><a href="https://www.cursoemvideo.com">Site do CursoemVideo</a></li>
    </ul>
    
</body>
</html>
