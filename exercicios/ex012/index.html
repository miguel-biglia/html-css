<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos em html5</title>
</head>
<body>
    <h1>inserindo videos hospedados localmente</h1> 
    
    <p>este video esta hospedado no meu proprio servidor.</p> 
    <video width="350" poster="imagem/imagem.png.png" controls loop> <source src="midia/meu-video.mp4.mp4" type="video/mp4"> </video> 
    
    <h1>inserindo videos do youtube</h1>
    <!--youtube/video/compartilhar/incorporar/copia-->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/CAYDRIbXFAc?si=NeXKd3Z3uIsfQu5e" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
